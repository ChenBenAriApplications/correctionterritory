name: Deploy CrossFit Presentation

on:
  push:
    branches:
      - cursor/crossfit-presentation-b937
      - main
    paths:
      - 'crossfit-presentation/**'
      - '.github/workflows/deploy-crossfit-presentation.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crossfit-presentation/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: crossfit-presentation

      - name: Build React app
        run: npm run build
        working-directory: crossfit-presentation

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crossfit-presentation/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
