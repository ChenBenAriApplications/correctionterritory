<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>גורי מיניונים</title>
    <meta name="description" content="גורי גורי גורי גורי">
    <meta property="og:title" content="גורי מיניונים">
    <meta property="og:description" content="גורי גורי גורי גורי">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="he_IL">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="גורי מיניונים">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }

        body { background: #1b5e20; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }

        #startBtn {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: linear-gradient(135deg, #ffe566, #f5d000);
            color: #333;
            font-size: clamp(2rem, 10vw, 4rem);
            font-weight: bold;
            cursor: pointer;
            z-index: 9999;
            -webkit-appearance: none;
            appearance: none;
            animation: btnBounce 1s ease-in-out infinite;
        }

        #startBtn:active {
            background: linear-gradient(135deg, #f5d000, #e6b800);
            transform: scale(0.98);
        }

        #startBtn.hidden { display: none; }

        @keyframes btnBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .minion-field {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: none;
            overflow: hidden;
            background: linear-gradient(180deg, #2e7d32 0%, #1b5e20 55%, #0d3d12 100%);
        }

        .minion-field.active { display: block; }

        .stadium-lights {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 15% 0%, rgba(255,255,200,0.35) 0%, transparent 45%),
                radial-gradient(ellipse at 85% 0%, rgba(255,255,200,0.35) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.3) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .minion {
            position: absolute;
            will-change: transform;
            filter: drop-shadow(1px 3px 4px rgba(0,0,0,0.35));
            z-index: 2;
        }

        .minion-body {
            position: relative;
            width: var(--size);
            height: calc(var(--size) * 1.4);
        }

        .minion-head {
            width: var(--size);
            height: calc(var(--size) * 0.88);
            background: linear-gradient(160deg, #ffe566 0%, #f5d000 50%, #e6c200 100%);
            border-radius: 50% 50% 45% 45%;
            position: relative;
            z-index: 2;
            animation: headShake 0.25s ease-in-out infinite alternate;
        }

        @keyframes headShake {
            from { transform: rotate(-3deg); }
            to { transform: rotate(3deg); }
        }

        .goggles {
            position: absolute;
            top: 26%;
            left: 50%;
            transform: translateX(-50%) rotate(var(--goggle-tilt, 0deg));
            display: flex;
            gap: 1px;
            z-index: 3;
        }

        .goggle-lens {
            width: calc(var(--size) * 0.33);
            height: calc(var(--size) * 0.33);
            background: radial-gradient(circle at 35% 35%, #e8e8e8, #9e9e9e 60%, #616161);
            border-radius: 50%;
            border: 2px solid #424242;
            position: relative;
            overflow: hidden;
        }

        .goggle-lens::after {
            content: '';
            position: absolute;
            width: 38%;
            height: 38%;
            background: #1a1a2e;
            border-radius: 50%;
            top: 38%;
            left: 32%;
        }

        .goggle-bridge {
            width: calc(var(--size) * 0.07);
            height: calc(var(--size) * 0.11);
            background: #424242;
            align-self: center;
            border-radius: 2px;
        }

        .goggle-strap {
            position: absolute;
            top: 30%;
            left: -10%;
            right: -10%;
            height: calc(var(--size) * 0.09);
            background: #424242;
            border-radius: 4px;
            z-index: 1;
        }

        .mouth {
            position: absolute;
            bottom: 14%;
            left: 50%;
            transform: translateX(-50%);
            width: calc(var(--size) * 0.32);
            height: calc(var(--size) * 0.22);
            background: #2d2d2d;
            border-radius: 50%;
            animation: yell 0.55s ease-in-out infinite alternate;
        }

        @keyframes yell {
            from { transform: translateX(-50%) scale(0.9); }
            to { transform: translateX(-50%) scale(1.2); }
        }

        .overalls {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: calc(var(--size) * 0.78);
            height: calc(var(--size) * 0.52);
            background: linear-gradient(180deg, #1565c0, #0d47a1);
            border-radius: 8px 8px 12px 12px;
            z-index: 1;
        }

        .overalls::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: calc(var(--size) * 0.2);
            height: 55%;
            background: #0d47a1;
            border-radius: 0 0 4px 4px;
        }

        .arm {
            position: absolute;
            width: calc(var(--size) * 0.14);
            height: calc(var(--size) * 0.42);
            background: linear-gradient(160deg, #ffe566, #f5d000);
            border-radius: 8px;
            top: 38%;
            z-index: 4;
            transform-origin: bottom center;
        }

        .arm.left {
            left: -2%;
            animation: armLeft 1s ease-in-out infinite alternate;
        }

        .arm.right {
            right: -2%;
            animation: armRight 1s ease-in-out infinite alternate-reverse;
        }

        @keyframes armLeft {
            from { transform: rotate(-155deg); }
            to { transform: rotate(-125deg); }
        }

        @keyframes armRight {
            from { transform: rotate(155deg); }
            to { transform: rotate(125deg); }
        }

        .leg {
            position: absolute;
            bottom: -10%;
            width: calc(var(--size) * 0.17);
            height: calc(var(--size) * 0.18);
            background: #0d47a1;
            border-radius: 0 0 5px 5px;
        }

        .leg.left { left: 20%; }
        .leg.right { right: 20%; }

        .shoe {
            position: absolute;
            bottom: -18%;
            width: calc(var(--size) * 0.2);
            height: calc(var(--size) * 0.09);
            background: #212121;
            border-radius: 50% 50% 3px 3px;
        }

        .shoe.left { left: 17%; }
        .shoe.right { right: 17%; }

        @keyframes crowdJump {
            0%, 100% { transform: translateY(0) scaleX(1); }
            35% { transform: translateY(calc(-1 * var(--bounce))) scaleX(1.05); }
            55% { transform: translateY(calc(-1 * var(--bounce) * 0.6)) scaleX(0.98); }
            75% { transform: translateY(calc(-1 * var(--bounce) * 0.9)) scaleX(1.03); }
        }

        .chant-bubble {
            position: absolute;
            color: #fff;
            font-weight: 900;
            font-size: calc(var(--size) * 0.28);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
        }

        .minion.chanting .chant-bubble {
            animation: bubblePop 0.8s ease-out;
        }

        @keyframes bubblePop {
            0% { opacity: 0; transform: translateX(-50%) translateY(0) scale(0.5); }
            30% { opacity: 1; transform: translateX(-50%) translateY(-8px) scale(1.2); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px) scale(1); }
        }
    </style>
</head>
<body>
    <button type="button" id="startBtn">מיניונים</button>
    <div class="minion-field" id="minionField">
        <div class="stadium-lights"></div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const field = document.getElementById('minionField');
        let isRunning = false;
        let voices = [];
        let minions = [];
        let audioCtx = null;
        let noiseNode = null;
        let chantRunning = false;
        let chantInterval = null;

        const CHANT_EVERY_MS = 1000;
        const CHANT_MS = 400;

        function loadVoices() {
            voices = speechSynthesis.getVoices();
        }
        if ('speechSynthesis' in window) {
            speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        function getHebrewVoice() {
            return voices.find(v => v.lang.startsWith('he')) ||
                   voices.find(v => v.lang.includes('he')) ||
                   voices[0];
        }

        function unlockSpeech() {
            if (!('speechSynthesis' in window)) return;
            speechSynthesis.resume();
            const silent = new SpeechSynthesisUtterance('\u200b');
            silent.volume = 0.01;
            silent.rate = 10;
            speechSynthesis.speak(silent);
        }

        function startStadiumAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioCtx.sampleRate * 2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * 0.5;
                }
                noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = noiseBuffer;
                noiseNode.loop = true;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 600;
                filter.Q.value = 0.4;
                const gain = audioCtx.createGain();
                gain.gain.value = 0.12;
                noiseNode.connect(filter).connect(gain).connect(audioCtx.destination);
                noiseNode.start();
            } catch (e) { /* audio optional */ }
        }

        function playCrowdHit() {
            if (!audioCtx || !isRunning) return;
            const t = audioCtx.currentTime;
            const dur = CHANT_MS / 1000;

            const osc = audioCtx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, t);
            osc.frequency.exponentialRampToValueAtTime(380, t + dur * 0.9);

            const oscGain = audioCtx.createGain();
            oscGain.gain.setValueAtTime(0.08, t);
            oscGain.gain.exponentialRampToValueAtTime(0.001, t + dur);

            osc.connect(oscGain).connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + dur);

            const stomp = audioCtx.createOscillator();
            const stompG = audioCtx.createGain();
            stomp.type = 'sine';
            stomp.frequency.setValueAtTime(75, t);
            stompG.gain.setValueAtTime(0.14, t);
            stompG.gain.exponentialRampToValueAtTime(0.001, t + dur);
            stomp.connect(stompG).connect(audioCtx.destination);
            stomp.start(t);
            stomp.stop(t + dur);
        }

        function triggerChantBubbles() {
            if (!isRunning || minions.length === 0) return;
            const batch = 2 + Math.floor(Math.random() * 3);
            for (let i = 0; i < batch; i++) {
                const m = minions[Math.floor(Math.random() * minions.length)];
                m.classList.remove('chanting');
                void m.offsetWidth;
                m.classList.add('chanting');
            }
        }

        function shoutGoriBeat() {
            if (!isRunning || !('speechSynthesis' in window)) return;

            triggerChantBubbles();
            playCrowdHit();
            speechSynthesis.cancel();

            const voice = getHebrewVoice();
            const cutoff = setTimeout(function() { speechSynthesis.cancel(); }, CHANT_MS);

            const u1 = new SpeechSynthesisUtterance('גו');
            u1.lang = 'he-IL';
            u1.rate = 4.2;
            u1.pitch = 0.62;
            u1.volume = 1;
            if (voice) u1.voice = voice;

            u1.onend = function() {
                const u2 = new SpeechSynthesisUtterance('רי!');
                u2.lang = 'he-IL';
                u2.rate = 4.8;
                u2.pitch = 1.38;
                u2.volume = 1;
                if (voice) u2.voice = voice;
                u2.onend = function() { clearTimeout(cutoff); };
                u2.onerror = function() { clearTimeout(cutoff); };
                speechSynthesis.speak(u2);
            };
            u1.onerror = function() { clearTimeout(cutoff); };
            speechSynthesis.speak(u1);
        }

        function crowdChant() {
            if (!isRunning || chantRunning || !('speechSynthesis' in window)) return;
            chantRunning = true;
            shoutGoriBeat();
            chantInterval = setInterval(shoutGoriBeat, CHANT_EVERY_MS);
        }

        function calcMinionCount() {
            const cellW = 42;
            const cellH = 52;
            const cols = Math.ceil(window.innerWidth / cellW) + 1;
            const rows = Math.ceil(window.innerHeight / cellH) + 1;
            return cols * rows;
        }

        function createMinion(col, row, cols, rows) {
            const size = 28 + Math.random() * 14;
            const cellW = window.innerWidth / cols;
            const cellH = window.innerHeight / rows;
            const left = col * cellW + (Math.random() - 0.5) * cellW * 0.4;
            const top = row * cellH + (Math.random() - 0.5) * cellH * 0.3;
            const bounce = 10 + Math.random() * 16;
            const duration = 0.9 + Math.random() * 0.2;
            const delay = Math.random() * 1.2;
            const goggleTilt = (Math.random() - 0.5) * 16;

            const el = document.createElement('div');
            el.className = 'minion';
            el.style.cssText = `
                --size: ${size}px;
                --bounce: ${bounce}px;
                --goggle-tilt: ${goggleTilt}deg;
                left: ${left}px;
                top: ${top}px;
                animation: crowdJump ${duration}s ease-in-out ${delay}s infinite;
            `;

            el.innerHTML = `
                <div class="minion-body">
                    <div class="chant-bubble">גורי!</div>
                    <div class="arm left"></div>
                    <div class="arm right"></div>
                    <div class="minion-head">
                        <div class="goggle-strap"></div>
                        <div class="goggles">
                            <div class="goggle-lens"></div>
                            <div class="goggle-bridge"></div>
                            <div class="goggle-lens"></div>
                        </div>
                        <div class="mouth"></div>
                    </div>
                    <div class="overalls"></div>
                    <div class="leg left"></div>
                    <div class="leg right"></div>
                    <div class="shoe left"></div>
                    <div class="shoe right"></div>
                </div>
            `;

            field.appendChild(el);
            return el;
        }

        function fillScreenWithMinions() {
            minions = [];
            const existing = field.querySelectorAll('.minion');
            existing.forEach(function(m) { m.remove(); });

            const count = calcMinionCount();
            const cols = Math.ceil(Math.sqrt(count * (window.innerWidth / window.innerHeight)));
            const rows = Math.ceil(count / cols);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (minions.length >= count) break;
                    minions.push(createMinion(c, r, cols, rows));
                }
            }
        }

        function startExperience() {
            if (isRunning) return;
            isRunning = true;

            unlockSpeech();
            startBtn.classList.add('hidden');
            field.classList.add('active');

            fillScreenWithMinions();
            startStadiumAudio();
            crowdChant();
        }

        startBtn.addEventListener('click', startExperience, { passive: false });
        startBtn.addEventListener('touchend', function(e) {
            e.preventDefault();
            startExperience();
        }, { passive: false });

        window.addEventListener('resize', function() {
            if (isRunning) fillScreenWithMinions();
        });

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
                if (chantInterval) { clearInterval(chantInterval); chantInterval = null; }
            } else if (isRunning) {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                if ('speechSynthesis' in window) speechSynthesis.resume();
                if (!chantInterval && chantRunning) {
                    shoutGoriBeat();
                    chantInterval = setInterval(shoutGoriBeat, CHANT_EVERY_MS);
                }
            }
        });
    </script>
</body>
</html>
