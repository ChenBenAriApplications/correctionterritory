<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>גורי מיניונים</title>
    <meta name="description" content="גורי! קהל באצטדיון">
    <meta property="og:title" content="גורי מיניונים">
    <meta property="og:description" content="גורי! קהל באצטדיון">
    <meta property="og:type" content="website">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; touch-action: manipulation; }
        body { background: #1b5e20; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }

        .crowd-field {
            position: fixed; inset: 0; overflow: hidden;
            background: linear-gradient(180deg, #2e7d32 0%, #1b5e20 55%, #0d3d12 100%);
        }

        .stadium-lights {
            position: absolute; inset: 0; pointer-events: none; z-index: 0;
            background:
                radial-gradient(ellipse at 15% 0%, rgba(255,255,200,0.4) 0%, transparent 45%),
                radial-gradient(ellipse at 85% 0%, rgba(255,255,200,0.4) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.35) 0%, transparent 60%);
        }

        .fan {
            position: absolute; will-change: transform;
            filter: drop-shadow(1px 3px 5px rgba(0,0,0,0.35)); z-index: 2;
        }

        .fan-body { position: relative; width: var(--size); height: calc(var(--size) * 1.5); }

        .ear {
            position: absolute; width: calc(var(--size) * 0.42); height: calc(var(--size) * 0.42);
            background: #111; border-radius: 50%; top: -8%; z-index: 1;
        }
        .ear.left { left: 2%; }
        .ear.right { right: 2%; }

        .head {
            width: var(--size); height: calc(var(--size) * 0.9);
            border-radius: 50%; position: relative; z-index: 3;
            animation: headShake 0.35s ease-in-out infinite alternate;
        }

        .type-mickey .head { background: radial-gradient(circle at 40% 35%, #4a4a4a, #1a1a1a); }
        .type-minnie .head { background: radial-gradient(circle at 40% 35%, #4a4a4a, #1a1a1a); }
        .type-donald .head { background: radial-gradient(circle at 40% 30%, #fff, #e8e8e8); }
        .type-goofy .head { background: radial-gradient(circle at 40% 35%, #2d2d2d, #111); }
        .type-daisy .head { background: radial-gradient(circle at 40% 35%, #fff, #f0e6d8); }

        .bow {
            position: absolute; top: -6%; left: 50%; transform: translateX(-50%);
            width: calc(var(--size) * 0.55); height: calc(var(--size) * 0.22);
            background: #e91e63; border-radius: 40%; z-index: 5;
        }
        .bow::before, .bow::after {
            content: ''; position: absolute; top: 20%; width: 35%; height: 70%;
            background: #e91e63; border-radius: 50%;
        }
        .bow::before { left: -18%; }
        .bow::after { right: -18%; }

        .bill {
            position: absolute; bottom: 22%; left: 50%; transform: translateX(-50%);
            width: calc(var(--size) * 0.5); height: calc(var(--size) * 0.18);
            background: #ffb300; border-radius: 50% 50% 45% 45%; z-index: 4;
        }

        .eye {
            position: absolute; width: calc(var(--size) * 0.16); height: calc(var(--size) * 0.22);
            background: #fff; border-radius: 50%; top: 32%; z-index: 4;
            border: 2px solid #111;
        }
        .eye::after {
            content: ''; position: absolute; width: 55%; height: 55%;
            background: #111; border-radius: 50%; bottom: 8%; left: 22%;
        }
        .eye.left { left: 22%; }
        .eye.right { right: 22%; }

        .type-donald .eye, .type-daisy .eye {
            width: calc(var(--size) * 0.14); height: calc(var(--size) * 0.2); top: 30%;
        }

        .snout {
            position: absolute; bottom: 18%; left: 50%; transform: translateX(-50%);
            width: calc(var(--size) * 0.35); height: calc(var(--size) * 0.2);
            background: #f5d0b0; border-radius: 50%; z-index: 4;
        }

        .mouth {
            position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
            width: calc(var(--size) * 0.28); height: calc(var(--size) * 0.18);
            background: #222; border-radius: 50%;
            animation: yell 0.45s ease-in-out infinite alternate;
        }

        .shirt {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: calc(var(--size) * 0.8); height: calc(var(--size) * 0.55);
            border-radius: 10px 10px 14px 14px; z-index: 2;
        }
        .type-mickey .shirt { background: linear-gradient(180deg, #e53935, #b71c1c); }
        .type-minnie .shirt { background: linear-gradient(180deg, #e91e63, #ad1457); }
        .type-donald .shirt { background: linear-gradient(180deg, #1565c0, #0d47a1); }
        .type-goofy .shirt { background: linear-gradient(180deg, #ff6f00, #e65100); }
        .type-daisy .shirt { background: linear-gradient(180deg, #ab47bc, #7b1fa2); }

        .arm {
            position: absolute; width: calc(var(--size) * 0.13); height: calc(var(--size) * 0.4);
            border-radius: 8px; top: 42%; z-index: 4; transform-origin: bottom center;
        }
        .type-mickey .arm, .type-minnie .arm { background: #111; }
        .type-donald .arm, .type-daisy .arm { background: #f5d0b0; }
        .type-goofy .arm { background: #111; }
        .arm.left { left: 0; animation: armLeft 0.8s ease-in-out infinite alternate; }
        .arm.right { right: 0; animation: armRight 0.8s ease-in-out infinite alternate-reverse; }

        @keyframes headShake { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
        @keyframes yell { from { transform: translateX(-50%) scale(0.85); } to { transform: translateX(-50%) scale(1.25); } }
        @keyframes armLeft { from { transform: rotate(-150deg); } to { transform: rotate(-120deg); } }
        @keyframes armRight { from { transform: rotate(150deg); } to { transform: rotate(120deg); } }

        @keyframes crowdJump {
            0%, 100% { transform: translateY(0); }
            40% { transform: translateY(calc(-1 * var(--bounce))); }
            70% { transform: translateY(calc(-1 * var(--bounce) * 0.5)); }
        }

        .chant-bubble {
            position: absolute; top: -22%; left: 50%; transform: translateX(-50%);
            color: #fff; font-weight: 900; font-size: calc(var(--size) * 0.26);
            text-shadow: 1px 1px 4px rgba(0,0,0,0.7); opacity: 0; pointer-events: none; white-space: nowrap;
        }
        .fan.chanting .chant-bubble { animation: bubblePop 0.7s ease-out; }
        @keyframes bubblePop {
            0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
            25% { opacity: 1; transform: translateX(-50%) translateY(-6px) scale(1.15); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-18px) scale(1); }
        }
    </style>
</head>
<body>
    <div class="crowd-field active" id="crowdField">
        <div class="stadium-lights"></div>
    </div>

    <script>
        const field = document.getElementById('crowdField');
        const TYPES = ['mickey', 'minnie', 'donald', 'goofy', 'daisy'];
        const CHANT_EVERY_MS = 1000;
        const CROWD_LAYERS = 14;
        const GORI_CLIP_URLS = Array.from({length: 12}, (_, i) => `audio/gori-play-${i + 1}.mp3`);

        let isRunning = false;
        let fans = [];
        let audioCtx, masterGain, reverbNode, crowdBus, chantBus, crowdNoiseGain;
        let chantInterval = null;
        let goriBuffers = [];

        function makeReverbIR(seconds, decay) {
            const rate = audioCtx.sampleRate;
            const len = rate * seconds;
            const buf = audioCtx.createBuffer(2, len, rate);
            for (let c = 0; c < 2; c++) {
                const ch = buf.getChannelData(c);
                for (let i = 0; i < len; i++) {
                    ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
                }
            }
            return buf;
        }

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            masterGain = audioCtx.createGain();
            masterGain.gain.value = 1.1;

            reverbNode = audioCtx.createConvolver();
            reverbNode.buffer = makeReverbIR(2.8, 2.2);
            reverbNode.connect(masterGain);

            crowdBus = audioCtx.createGain();
            crowdBus.gain.value = 0.85;
            crowdBus.connect(reverbNode);

            chantBus = audioCtx.createGain();
            chantBus.gain.value = 1.0;
            chantBus.connect(reverbNode);
            chantBus.connect(masterGain);

            masterGain.connect(audioCtx.destination);

            const bufLen = audioCtx.sampleRate * 3;
            const noiseBuf = audioCtx.createBuffer(2, bufLen, audioCtx.sampleRate);
            for (let c = 0; c < 2; c++) {
                const d = noiseBuf.getChannelData(c);
                for (let i = 0; i < bufLen; i++) d[i] = (Math.random() * 2 - 1) * 0.35;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = noiseBuf;
            noise.loop = true;
            const bp = audioCtx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.value = 450;
            bp.Q.value = 0.35;
            crowdNoiseGain = audioCtx.createGain();
            crowdNoiseGain.gain.value = 0.22;
            noise.connect(bp).connect(crowdNoiseGain).connect(crowdBus);
            noise.start();
        }

        async function loadGoriClips() {
            if (goriBuffers.length) return;
            for (const url of GORI_CLIP_URLS) {
                try {
                    const res = await fetch(url);
                    goriBuffers.push(await audioCtx.decodeAudioData(await res.arrayBuffer()));
                } catch (e) { /* skip missing */ }
            }
        }

        function playStadiumCrowdChant() {
            if (!audioCtx || !goriBuffers.length) return;

            const t = audioCtx.currentTime;
            const pick = () => goriBuffers[Math.floor(Math.random() * goriBuffers.length)];

            for (let i = 0; i < CROWD_LAYERS; i++) {
                const src = audioCtx.createBufferSource();
                src.buffer = pick();
                src.playbackRate.value = 0.88 + Math.random() * 0.28;

                const pan = audioCtx.createStereoPanner();
                pan.pan.value = (Math.random() - 0.5) * 1.6;

                const g = audioCtx.createGain();
                g.gain.value = 0.25 + Math.random() * 0.45;

                const delay = Math.random() * 0.09;
                src.connect(pan).connect(g).connect(chantBus);
                src.start(t + delay);
            }

            const swell = audioCtx.createOscillator();
            const swellG = audioCtx.createGain();
            swell.type = 'sine';
            swell.frequency.setValueAtTime(90, t);
            swell.frequency.exponentialRampToValueAtTime(200, t + 0.35);
            swellG.gain.setValueAtTime(0.06, t);
            swellG.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
            swell.connect(swellG).connect(crowdBus);
            swell.start(t);
            swell.stop(t + 0.42);

            crowdNoiseGain.gain.setTargetAtTime(0.32, t, 0.05);
            crowdNoiseGain.gain.setTargetAtTime(0.22, t + 0.5, 0.15);
        }

        function triggerBubbles() {
            const n = 4 + Math.floor(Math.random() * 6);
            for (let i = 0; i < n; i++) {
                const f = fans[Math.floor(Math.random() * fans.length)];
                if (!f) continue;
                f.classList.remove('chanting');
                void f.offsetWidth;
                f.classList.add('chanting');
            }
        }

        function shoutBeat() {
            triggerBubbles();
            playStadiumCrowdChant();
        }

        function startChant() {
            shoutBeat();
            chantInterval = setInterval(shoutBeat, CHANT_EVERY_MS);
        }

        function charHTML(type) {
            const extras = {
                mickey: '<div class="ear left"></div><div class="ear right"></div><div class="head"><div class="eye left"></div><div class="eye right"></div><div class="mouth"></div></div>',
                minnie: '<div class="ear left"></div><div class="ear right"></div><div class="bow"></div><div class="head"><div class="eye left"></div><div class="eye right"></div><div class="mouth"></div></div>',
                donald: '<div class="head"><div class="eye left"></div><div class="eye right"></div><div class="bill"></div><div class="mouth"></div></div>',
                goofy: '<div class="ear left"></div><div class="ear right"></div><div class="head"><div class="eye left"></div><div class="eye right"></div><div class="snout"></div><div class="mouth"></div></div>',
                daisy: '<div class="bow"></div><div class="head"><div class="eye left"></div><div class="eye right"></div><div class="bill"></div><div class="mouth"></div></div>'
            };
            return `<div class="fan-body type-${type}"><div class="chant-bubble">גורי!</div><div class="arm left"></div><div class="arm right"></div>${extras[type]}<div class="shirt"></div></div>`;
        }

        function fillScreen() {
            fans = [];
            field.querySelectorAll('.fan').forEach(el => el.remove());
            const cellW = 46, cellH = 58;
            const cols = Math.ceil(window.innerWidth / cellW) + 1;
            const rows = Math.ceil(window.innerHeight / cellH) + 1;
            const cellWidth = window.innerWidth / cols;
            const cellHeight = window.innerHeight / rows;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const type = TYPES[Math.floor(Math.random() * TYPES.length)];
                    const size = 30 + Math.random() * 16;
                    const el = document.createElement('div');
                    el.className = `fan type-${type}`;
                    el.style.cssText = `
                        --size:${size}px; --bounce:${10 + Math.random() * 18}px;
                        left:${c * cellWidth + (Math.random() - 0.5) * cellWidth * 0.35}px;
                        top:${r * cellHeight + (Math.random() - 0.5) * cellHeight * 0.3}px;
                        animation:crowdJump ${0.85 + Math.random() * 0.25}s ease-in-out ${Math.random() * 1.2}s infinite;
                    `;
                    el.innerHTML = charHTML(type);
                    field.appendChild(el);
                    fans.push(el);
                }
            }
        }

        async function startExperience() {
            if (isRunning) return;
            isRunning = true;
            fillScreen();
            initAudio();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            await loadGoriClips();
            startChant();
        }

        fillScreen();
        startExperience();

        document.body.addEventListener('pointerdown', function kick() {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            document.body.removeEventListener('pointerdown', kick);
        }, { once: true });

        window.addEventListener('resize', () => { if (isRunning) fillScreen(); });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (chantInterval) { clearInterval(chantInterval); chantInterval = null; }
                if (audioCtx) audioCtx.suspend();
            } else if (isRunning) {
                audioCtx.resume();
                if (!chantInterval) startChant();
            }
        });
    </script>
</body>
</html>
